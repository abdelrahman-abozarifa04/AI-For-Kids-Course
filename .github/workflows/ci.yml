name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ipykernel install --user
      - name: Validate cards
        run: python tools/build_cards.py --check
      - name: Run notebooks, solutions, card and app tests
        run: pytest -v
      - name: Build website (strict)
        run: |
          python tools/build_cards.py
          mkdocs build --strict
